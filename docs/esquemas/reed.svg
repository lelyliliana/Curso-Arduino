<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="352" viewBox="0 0 1080 352" role="img" aria-labelledby="titulo descripcion">
<title id="titulo">Reed de contacto seco y LED</title>
<desc id="descripcion">Esquema funcional de conexiones para Uno R3. Uno D2 — Contacto reed seco — Uno GND; Uno D8 — 330 Ω — LED: A → K → GND.</desc>
<rect width="1080" height="352" fill="#f3f6fa"/>
<style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#15263c}.title{font-size:24px;font-weight:bold}.sub{font-size:14px}.pin{font-size:17px;font-weight:bold}.via{font-size:14px}.note{font-size:15px}</style>
<text x="32" y="40" class="title">Reed de contacto seco y LED</text>
<text x="32" y="66" class="sub">CONEXIONES FUNCIONALES · UNO R3 / ATmega328P · NO ES UNA VISTA FÍSICA DE PROTOBOARD</text>
<rect x="26" y="85" width="1028" height="55" rx="9" fill="white"/>
<text x="42" y="117" class="pin">Uno D2</text>
<path d="M 320 112 H 675" fill="none" stroke="#1477a2" stroke-width="3"/>
<circle cx="320" cy="112" r="4" fill="#1477a2"/><circle cx="675" cy="112" r="4" fill="#1477a2"/>
<rect x="355" y="98" width="285" height="28" rx="5" fill="#edf3f9" stroke="#1477a2"/>
<text x="497" y="117" class="via" text-anchor="middle">Contacto reed seco</text>
<text x="696" y="117" class="pin">Uno GND</text>
<rect x="26" y="151" width="1028" height="55" rx="9" fill="white"/>
<text x="42" y="183" class="pin">Uno D8</text>
<path d="M 320 178 H 675" fill="none" stroke="#1477a2" stroke-width="3"/>
<circle cx="320" cy="178" r="4" fill="#1477a2"/><circle cx="675" cy="178" r="4" fill="#1477a2"/>
<rect x="355" y="164" width="285" height="28" rx="5" fill="#edf3f9" stroke="#1477a2"/>
<text x="497" y="183" class="via" text-anchor="middle">330 Ω</text>
<text x="696" y="183" class="pin">LED: A → K → GND</text>
<text x="32" y="240" class="note">D2 usa INPUT_PULLUP. Contacto abierto HIGH; contacto cerrado LOW.</text>
<text x="32" y="265" class="note">Un módulo con salida electrónica necesita verificar su interfaz; no es este contacto.</text>
<text x="32" y="332" class="sub">Señales: azul · Alimentación: rojo · Masa: gris. Montar sin alimentación y contrastar con la tabla del curso.</text></svg>