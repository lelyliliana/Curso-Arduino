<text x="32" y="793" class="note">Backlight A/K: limitación según módulo. Consulta tabla completa de CONEXIONES.md.</text>
<text x="32" y="860" class="sub">Señales: azul · Alimentación: rojo · Masa: gris. Montar sin alimentación y contrastar con la tabla del curso.</text></svg>