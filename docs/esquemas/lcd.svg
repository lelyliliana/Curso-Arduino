<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="880" viewBox="0 0 1080 880" role="img" aria-labelledby="titulo descripcion">
<title id="titulo">LCD paralelo 16×2: seis señales de control</title>
<desc id="descripcion">Esquema funcional de conexiones para Uno R3. Uno D12 — RS — LCD pin 4; Uno D11 — E — LCD pin 6; Uno D5 — D4 del LCD — LCD pin 11; Uno D4 — D5 del LCD — LCD pin 12; Uno D3 — D6 del LCD — LCD pin 13; Uno D2 — D7 del LCD — LCD pin 14; Uno 5 V — Alimentación lógica — LCD VDD pin 2; Uno GND — Masa / solo escritura — LCD VSS pin 1 y RW pin 5; Pot contraste: cursor — Extremos 5 V y GND — LCD VO pin 3; Pot de entrada: cursor — Extremos 5 V y GND — Uno A0.</desc>
<rect width="1080" height="880" fill="#f3f6fa"/>
<style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#15263c}.title{font-size:24px;font-weight:bold}.sub{font-size:14px}.pin{font-size:17px;font-weight:bold}.via{font-size:14px}.note{font-size:15px}</style>
