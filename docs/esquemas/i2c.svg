<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="616" viewBox="0 0 1080 616" role="img" aria-labelledby="titulo descripcion">
<title id="titulo">I2C con periférico conocido compatible 5 V</title>
<desc id="descripcion">Esquema funcional de conexiones para Uno R3. Uno A4 / SDA — Línea SDA — Periférico SDA; Uno A5 / SCL — Línea SCL — Periférico SCL; Uno 5 V — Solo módulo compatible — Periférico VCC; Uno GND — Referencia común — Periférico GND; SDA — Pull-up según diseño — 5 V compatible; SCL — Pull-up según diseño — 5 V compatible.</desc>
<rect width="1080" height="616" fill="#f3f6fa"/>
<style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#15263c}.title{font-size:24px;font-weight:bold}.sub{font-size:14px}.pin{font-size:17px;font-weight:bold}.via{font-size:14px}.note{font-size:15px}</style>
<text x="32" y="40" class="title">I2C con periférico conocido compatible 5 V</text>
<text x="32" y="66" class="sub">CONEXIONES FUNCIONALES · UNO R3 / ATmega328P · NO ES UNA VISTA FÍSICA DE PROTOBOARD</text>
