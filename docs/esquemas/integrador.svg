<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="550" viewBox="0 0 1080 550" role="img" aria-labelledby="titulo descripcion">
<title id="titulo">Integrador: sensor, modo y dos salidas</title>
<desc id="descripcion">Esquema funcional de conexiones para Uno R3. Uno 5 V / GND — Alimentación + desacoplo — TMP36 +Vs / GND; TMP36 VOUT — Señal analógica — Uno A0; Uno D8 — 330 Ω — LED: A → K → GND; Uno D7 — Piezo pasivo (+) — Piezo (−) → GND; Uno D2 — Contacto del pulsador — Uno GND.</desc>
<rect width="1080" height="550" fill="#f3f6fa"/>
<style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#15263c}.title{font-size:24px;font-weight:bold}.sub{font-size:14px}.pin{font-size:17px;font-weight:bold}.via{font-size:14px}.note{font-size:15px}</style>
<text x="32" y="40" class="title">Integrador: sensor, modo y dos salidas</text>
<text x="32" y="66" class="sub">CONEXIONES FUNCIONALES · UNO R3 / ATmega328P · NO ES UNA VISTA FÍSICA DE PROTOBOARD</text>
<rect x="26" y="85" width="1028" height="55" rx="9" fill="white"/>
<text x="42" y="117" class="pin">Uno 5 V / GND</text>
<path d="M 320 112 H 675" fill="none" stroke="#b93828" stroke-width="3"/>
<circle cx="320" cy="112" r="4" fill="#b93828"/><circle cx="675" cy="112" r="4" fill="#b93828"/>
<rect x="355" y="98" width="285" height="28" rx="5" fill="#edf3f9" stroke="#b93828"/>
<text x="497" y="117" class="via" text-anchor="middle">Alimentación + desacoplo</text>
<text x="696" y="117" class="pin">TMP36 +Vs / GND</text>
<rect x="26" y="151" width="1028" height="55" rx="9" fill="white"/>
<text x="42" y="183" class="pin">TMP36 VOUT</text>
<path d="M 320 178 H 675" fill="none" stroke="#1477a2" stroke-width="3"/>
<circle cx="320" cy="178" r="4" fill="#1477a2"/><circle cx="675" cy="178" r="4" fill="#1477a2"/>
<rect x="355" y="164" width="285" height="28" rx="5" fill="#edf3f9" stroke="#1477a2"/>
<text x="497" y="183" class="via" text-anchor="middle">Señal analógica</text>
<text x="696" y="183" class="pin">Uno A0</text>
<rect x="26" y="217" width="1028" height="55" rx="9" fill="white"/>
<text x="42" y="249" class="pin">Uno D8</text>
<path d="M 320 244 H 675" fill="none" stroke="#1477a2" stroke-width="3"/>
<circle cx="320" cy="244" r="4" fill="#1477a2"/><circle cx="675" cy="244" r="4" fill="#1477a2"/>
<rect x="355" y="230" width="285" height="28" rx="5" fill="#edf3f9" stroke="#1477a2"/>
<text x="497" y="249" class="via" text-anchor="middle">330 Ω</text>
<text x="696" y="249" class="pin">LED: A → K → GND</text>
<rect x="26" y="283" width="1028" height="55" rx="9" fill="white"/>
<text x="42" y="315" class="pin">Uno D7</text>
<path d="M 320 310 H 675" fill="none" stroke="#1477a2" stroke-width="3"/>
<circle cx="320" cy="310" r="4" fill="#1477a2"/><circle cx="675" cy="310" r="4" fill="#1477a2"/>
<rect x="355" y="296" width="285" height="28" rx="5" fill="#edf3f9" stroke="#1477a2"/>
<text x="497" y="315" class="via" text-anchor="middle">Piezo pasivo (+)</text>
<text x="696" y="315" class="pin">Piezo (−) → GND</text>
<rect x="26" y="349" width="1028" height="55" rx="9" fill="white"/>
<text x="42" y="381" class="pin">Uno D2</text>
<path d="M 320 376 H 675" fill="none" stroke="#1477a2" stroke-width="3"/>
<circle cx="320" cy="376" r="4" fill="#1477a2"/><circle cx="675" cy="376" r="4" fill="#1477a2"/>
<rect x="355" y="362" width="285" height="28" rx="5" fill="#edf3f9" stroke="#1477a2"/>
<text x="497" y="381" class="via" text-anchor="middle">Contacto del pulsador</text>
<text x="696" y="381" class="pin">Uno GND</text>
<text x="32" y="438" class="note">TMP36: 100 nF entre +Vs y GND; comprueba ficha de encapsulado.</text>
<text x="32" y="463" class="note">Aquí el piezo usa D7; D8 ya pertenece al LED. D2 usa INPUT_PULLUP.</text>
<text x="32" y="530" class="sub">Señales: azul · Alimentación: rojo · Masa: gris. Montar sin alimentación y contrastar con la tabla del curso.</text></svg>